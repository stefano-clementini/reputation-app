name: CI/CD Multi-Container Pipeline with Grafana

# Questo GitHub Actions workflow è disegnato per automatizzare i processi di building, testing e deploying di un'applicazione multi-container che include FastAPI, Prometheus e Grafana. 
# Il workflow è formato da 2 jobs principali: integration tests e deployment su HuggingFace Spaces
on:
  push:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Install Docker Compose
      run: |
        sudo apt-get update
        sudo apt-get install -y docker-compose

    - name: Build and Start Stack
      run: |
        docker-compose up --build -d

    - name: Verify Service Health
      run: |
        sleep 20
        # Verifica l'API
        curl -f http://localhost:7860/health
        # Verifica Prometheus
        curl -f http://localhost:9090/-/healthy
        # Verifica Grafana
        curl -f http://localhost:3000/api/health

    - name: Stop Containers
      if: always()
      run: |
        docker-compose down

  deploy-to-huggingface:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Push to Hugging Face Spaces
      # Configura le credenziali, che sono memorizzate in una secret, per il push su HuggingFace Spaces e forza il push del branch main
      env:
        HF_TOKEN: ${{ secrets.AI_ENG_TOKEN }}
      run: |
        git config --global user.email "bot@github.com"
        git config --global user.name "GitHub Action Bot"
        
        # Deploy dell'app principale (FastAPI) su HF Spaces
        git remote add hf https://USER:$HF_TOKEN@huggingface.co/spaces/stefano-clementini/ai_eng
        git push hf main --force
