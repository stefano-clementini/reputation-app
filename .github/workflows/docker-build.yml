name: Docker Build Automatico

# Scegli l'evento che attiva l'automazione
on:
  push:
    branches: [ "main" ] # Cambia in "master" se il tuo ramo principale si chiama così
  pull_request:
    branches: [ "main" ]

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
    # 1. Scarica il codice del repository all'interno della macchina virtuale
    - name: Scarica il codice
      uses: actions/checkout@v4

    # 2. Configura l'ambiente Docker Buildx (per build più veloci ed efficienti)
    - name: Configura Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Esegue il comando docker build online e mostra l'output
    - name: Avvia Docker Build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false # Impostato su "false" per testare solo la build senza pubblicare l'immagine
